<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon no encontrado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="pokedex-wrapper">
        <div class="pokedex-nav" style="margin-bottom: 30px;">
            <div class="nav-top">
                <img src="{{ url_for('static', filename='img/pokebola.png') }}" alt="Pokébola" class="pokeball-icon" />
                <span class="nav-title">Pokédex</span>
            </div>
            <div class="nav-middle">
                <span class="nav-subtitle" style="color: #e53e3e;">Error 404</span>
            </div>
            <div class="nav-bottom">
                <div class="nav-buttons">
                    <button class="btn-view-all" onclick="window.location.href='/'">Volver</button>
                </div>
            </div>
        </div>

        <div style="text-align: center; padding: 40px 20px; background: white; border-radius: 12px; border: 1px solid #e2e8f0;">
            <div style="font-size: 80px; margin-bottom: 20px;">😢</div>
            <h2 style="color: #1a202c; margin-bottom: 10px;">Pokémon no encontrado</h2>
            <p style="color: #4a5568; font-size: 18px;">{{ mensaje }}</p>
        </div>
    </div>
</body>
</html>
